services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: ros2-jazzy-cpu:latest
    container_name: ros2_jazzy_cpu
    ports:
      - "8080:8080"
    ipc: host
    environment:
      - DISPLAY=:99
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=burger
    volumes:
      - ./ros2_ws:/home/ros/ros2_ws
    stdin_open: true
    tty: true